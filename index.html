<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Library CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container my-5">

        <h1 class="text-center text-primary">BOOK LIBRARY CRUD</h1>

        <form id="bookForm">

            <div class="row my-5">

                <input type="text" id="editStatus" hidden>

                <div class="col-lg-3">
                    <input id="bookName" type="text"placeholder="Enter Book Name"class="form-control">
                </div>

                <div class="col-lg-3">
                    <input id="author"type="text"placeholder="Enter Author"class="form-control">
                </div>

                <div class="col-lg-3">
                    <select id="category" class="form-select">

                        <option value="">Select Category</option>
                        <option value="Malayalam">Malayalam</option>
                        <option value="English">English</option>
                        <option value="History">History</option>
                        <option value="Science">Science</option>
                        <option value="Technology">Technology</option>

                    </select>
                </div>

                <div class="col-lg-3">
                    <button
                        type="submit"class="btn btn-success w-100">Save</button>
                </div>

            </div>

        </form>


        <table class="my-5 table table-bordered table-hover">

            <thead class="table-dark text-center">

                <tr>
                    <th>#</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script src="./main.js"></script>

</body>
</html>
